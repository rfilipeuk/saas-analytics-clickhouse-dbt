services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-portfolio
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_PASSWORD=portfolio123
    volumes:
      - ./clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    # Cap container memory so ClickHouse can't exhaust the host and crash it
    mem_limit: 1.5g
    # Tell ClickHouse itself to stay within a safe internal budget
    # (leaves headroom below mem_limit for OS/query overhead)